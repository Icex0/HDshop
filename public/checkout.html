<!DOCTYPE html>
<html ng-app="vulnerableApp">
<head>
    <title>Checkout</title>
    <script src="js/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            min-height: 100vh;
        }
        .checkout-container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a3e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid #404060;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #404060;
        }
        h1 {
            color: #ffffff;
            margin: 0;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-image {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #007bff;
        }
        .default-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #007bff;
        }
        .profile-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .profile-link:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        .logout-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .logout-btn:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
        .cart-items {
            margin-bottom: 30px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            margin-bottom: 15px;
            background: #333344;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #404060;
        }
        .cart-item img {
            width: 60px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 15px;
        }
        .item-details {
            flex: 1;
        }
        .item-details h3 {
            color: #ffffff;
            margin: 0 0 5px 0;
        }
        .item-details p {
            color: #b0b0c0;
            margin: 0;
        }
        .item-price {
            font-weight: bold;
            margin-right: 20px;
            color: #28a745;
            font-size: 1.1em;
        }
        .remove-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 12px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .remove-btn:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
        .order-summary {
            background: #333344;
            padding: 20px;
            border-radius: 10px;
            margin-top: 20px;
            border: 1px solid #404060;
        }
        .order-summary h2 {
            color: #ffffff;
            margin-top: 0;
        }
        .total {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #404060;
            color: #28a745;
        }
        button {
            padding: 12px 20px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-right: 10px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        .back-btn {
            background: linear-gradient(135deg, #6c757d, #5a6268);
        }
        .back-btn:hover {
            background: linear-gradient(135deg, #5a6268, #495057);
            box-shadow: 0 4px 15px rgba(108, 117, 125, 0.4);
        }
        .checkout-btn {
            background: linear-gradient(135deg, #28a745, #218838);
        }
        .checkout-btn:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.4);
        }
        .empty-cart {
            text-align: center;
            padding: 40px;
            color: #b0b0c0;
            background: #333344;
            border-radius: 10px;
            border: 1px solid #404060;
        }
        .empty-cart h2 {
            color: #ffffff;
        }
        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 6px;
            text-align: center;
            font-weight: bold;
        }
        .message.success {
            background-color: rgba(40, 167, 69, 0.2);
            color: #28a745;
            border: 1px solid #28a745;
        }
        .message.error {
            background-color: rgba(220, 53, 69, 0.2);
            color: #dc3545;
            border: 1px solid #dc3545;
        }
        .checkout-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .quantity-controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-right: 15px;
        }
        .quantity-btn {
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 5px 10px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .quantity-btn:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-1px);
            box-shadow: 0 2px 8px rgba(0, 123, 255, 0.4);
        }
        .quantity-display {
            font-weight: bold;
            min-width: 30px;
            text-align: center;
            color: #ffffff;
        }
    </style>
</head>
<body>
    <div class="checkout-container" ng-controller="CheckoutController">
        <div class="header">
            <h1>Checkout</h1>
            <div class="user-info">
                <img ng-if="user.profile_image" class="profile-image" ng-src="{{user.profile_image}}" alt="Profile Image">
                <div ng-if="!user.profile_image" class="default-avatar">
                    {{user.username.charAt(0).toUpperCase()}}
                </div>
                <a href="/profile.html" class="profile-link" ng-bind-html="trustedUsername"></a>
                <button class="logout-btn" ng-click="logout()">Logout</button>
            </div>
        </div>

        <div ng-if="message" class="message" ng-class="{'success': success, 'error': !success}">
            {{message}}
        </div>

        <div ng-if="cart.length === 0" class="empty-cart">
            <h2>Your cart is empty</h2>
            <p>Add some items to your cart before checking out.</p>
            <button class="back-btn" ng-click="goToShop()">Back to Shop</button>
        </div>

        <div ng-if="cart.length > 0">
            <div class="cart-items">
                <div class="cart-item" ng-repeat="item in cart">
                    <img ng-src="{{item.image}}" alt="{{item.name}}">
                    <div class="item-details">
                        <h3>{{item.name}}</h3>
                        <p>{{item.description}}</p>
                    </div>
                    <div class="quantity-controls">
                        <button class="quantity-btn" ng-click="decreaseQuantity($index)">-</button>
                        <span class="quantity-display">{{item.quantity}}</span>
                        <button class="quantity-btn" ng-click="increaseQuantity($index)">+</button>
                    </div>
                    <div class="item-price">${{(item.price * item.quantity).toFixed(2)}}</div>
                    <button class="remove-btn" ng-click="removeFromCart($index)">Remove</button>
                </div>
            </div>

            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="total">
                    Total: ${{getTotal().toFixed(2)}}
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button class="back-btn" ng-click="goToShop()">Back to Shop</button>
                <button class="checkout-btn" 
                        ng-click="completeCheckout()" 
                        ng-disabled="processing">
                    {{processing ? 'Processing...' : 'Complete Purchase'}}
                </button>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html ng-app="vulnerableApp">
<head>
    <title>Checkout</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f0f0f0;
        }
        .checkout-container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        .profile-picture {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #666;
            font-weight: bold;
        }
        .profile-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
        }
        .profile-link:hover {
            text-decoration: underline;
        }
        .cart-items {
            margin-bottom: 30px;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .cart-item img {
            width: 80px;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 15px;
        }
        .item-details {
            flex-grow: 1;
        }
        .item-price {
            font-weight: bold;
            color: #007bff;
        }
        .remove-btn {
            color: #dc3545;
            background: none;
            border: none;
            cursor: pointer;
            padding: 5px 10px;
        }
        .remove-btn:hover {
            text-decoration: underline;
        }
        .order-summary {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }
        .total {
            font-size: 1.2em;
            font-weight: bold;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #dee2e6;
        }
        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-right: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .back-btn {
            background-color: #6c757d;
        }
        .back-btn:hover {
            background-color: #5a6268;
        }
        .checkout-btn {
            background-color: #28a745;
        }
        .checkout-btn:hover {
            background-color: #218838;
        }
        .empty-cart {
            text-align: center;
            padding: 40px;
            color: #6c757d;
        }
        .message {
            margin: 20px 0;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
        }
        .message.success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .message.error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
        .checkout-btn:disabled {
            background-color: #6c757d;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="checkout-container" ng-controller="CheckoutController">
        <div class="header">
            <h1>Checkout</h1>
            <div class="user-info">
                <div class="profile-picture">{{user.username.charAt(0).toUpperCase()}}</div>
                <a href="/profile.html" class="profile-link">Profile</a>
                <button ng-click="logout()">Logout</button>
            </div>
        </div>

        <div ng-if="message" class="message" ng-class="{'success': success, 'error': !success}">
            {{message}}
        </div>

        <div ng-if="cart.length === 0" class="empty-cart">
            <h2>Your cart is empty</h2>
            <p>Add some items to your cart before checking out.</p>
            <button class="back-btn" ng-click="goToShop()">Back to Shop</button>
        </div>

        <div ng-if="cart.length > 0">
            <div class="cart-items">
                <div class="cart-item" ng-repeat="item in cart">
                    <img ng-src="{{item.image}}" alt="{{item.name}}">
                    <div class="item-details">
                        <h3>{{item.name}}</h3>
                        <p>{{item.description}}</p>
                    </div>
                    <div class="item-price">${{item.price}}</div>
                    <button class="remove-btn" ng-click="removeFromCart($index)">Remove</button>
                </div>
            </div>

            <div class="order-summary">
                <h2>Order Summary</h2>
                <div class="total">
                    Total: ${{getTotal()}}
                </div>
            </div>

            <div style="margin-top: 20px;">
                <button class="back-btn" ng-click="goToShop()">Back to Shop</button>
                <button class="checkout-btn" 
                        ng-click="completeCheckout()" 
                        ng-disabled="processing">
                    {{processing ? 'Processing...' : 'Complete Purchase'}}
                </button>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html ng-app="vulnerableApp">
<head>
    <title>User Profile</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            min-height: 100vh;
        }
        .profile-container {
            max-width: 800px;
            margin: 0 auto;
            background: #2a2a3e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid #404060;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #404060;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
        }
        .header .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 0;
        }
        .header .nav-links a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .header .nav-links a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        .header button {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .header button:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #b0b0c0;
        }
        input {
            width: 100%;
            padding: 12px;
            border: 2px solid #404060;
            border-radius: 6px;
            box-sizing: border-box;
            background-color: #1a1a2e;
            color: #ffffff;
            font-size: 16px;
            transition: border-color 0.3s ease;
        }
        input:focus {
            outline: none;
            border-color: #007bff;
            box-shadow: 0 0 10px rgba(0, 123, 255, 0.3);
        }
        input::placeholder {
            color: #7a7a90;
        }
        button {
            padding: 12px 16px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        button:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        .order-history {
            margin-top: 40px;
            border-top: 2px solid #404060;
            padding-top: 20px;
        }
        .order-history h2 {
            color: #ffffff;
        }
        .order-card {
            background: #333344;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid #404060;
        }
        .order-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            padding-bottom: 10px;
            border-bottom: 1px solid #404060;
        }
        .order-id {
            font-weight: bold;
            color: #007bff;
        }
        .order-date {
            color: #b0b0c0;
        }
        .order-total {
            font-weight: bold;
            color: #28a745;
        }
        .order-items {
            margin-top: 10px;
        }
        .order-item {
            display: flex;
            align-items: center;
            padding: 5px 0;
        }
        .order-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 6px;
            margin-right: 10px;
        }
        .order-item-details {
            flex-grow: 1;
        }
        .order-item-name {
            font-weight: bold;
            margin: 0;
            color: #ffffff;
        }
        .order-item-price {
            color: #28a745;
            margin: 0;
        }
        .no-orders {
            text-align: center;
            padding: 20px;
            color: #b0b0c0;
            background: #333344;
            border-radius: 10px;
            border: 1px solid #404060;
        }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .notification.error {
            background-color: rgba(220, 53, 69, 0.9);
            border: 1px solid #dc3545;
        }
        .notification.success {
            background-color: rgba(40, 167, 69, 0.9);
            border: 1px solid #28a745;
        }
        @keyframes slideIn {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        .profile-image {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
        }
        .profile-image img, .profile-image .default-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #007bff;
        }
        .profile-image .default-avatar {
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .profile-image input[type="file"] {
            display: none;
        }
        .profile-image label {
            display: inline-block;
            padding: 12px 16px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-size: 14px;
            font-weight: bold;
        }
        .profile-image label:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
    </style>
</head>
<body>
    <div class="profile-container" ng-controller="ProfileController">
        <div class="notification" ng-class="{'error': !success, 'success': success}" ng-show="message">
            {{message}}
        </div>

        <div class="header">
            <h1>User Profile</h1>
            <div class="nav-links">
                <a href="/shop.html">Back to Shop</a>
                <button ng-click="logout()">Logout</button>
            </div>
        </div>

        <div class="profile-image">
            <img ng-if="user.profile_image" ng-src="{{user.profile_image}}" alt="Profile Image">
            <div ng-if="!user.profile_image" class="default-avatar">
                {{user.username.charAt(0).toUpperCase()}}
            </div>
            <label for="profileImage">Change Profile Picture</label>
            <input type="file" id="profileImage" accept="image/*" onchange="angular.element(this).scope().uploadImage(this)">
        </div>

        <form ng-submit="updateProfile()">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" ng-model="user.username" required>
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" ng-model="user.email" required>
            </div>
            <div class="form-group">
                <label for="currentPassword">Current Password:</label>
                <input type="password" id="currentPassword" ng-model="currentPassword">
            </div>
            <div class="form-group">
                <label for="newPassword">New Password:</label>
                <input type="password" id="newPassword" ng-model="newPassword">
            </div>
            <button type="submit">Update Profile</button>
        </form>

        <div class="order-history">
            <h2>Order History</h2>
            <div ng-if="orders.length === 0" class="no-orders">
                <p>No orders found</p>
            </div>
            <div class="order-card" ng-repeat="order in orders">
                <div class="order-header">
                    <span class="order-id">Order #{{order.id}}</span>
                    <span class="order-date">{{order.created_at | date:'medium'}}</span>
                </div>
                <div class="order-items">
                    <div class="order-item" ng-repeat="item in order.items">
                        <img ng-src="{{item.image}}" alt="{{item.name}}">
                        <div class="order-item-details">
                            <p class="order-item-name">{{item.name}}</p>
                            <p class="order-item-price">${{item.price}} x {{item.quantity || 1}}</p>
                        </div>
                    </div>
                </div>
                <div class="order-total">
                    Total: ${{order.total_amount}}
                </div>
            </div>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html ng-app="vulnerableApp">
<head>
    <title>Admin Panel</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            min-height: 100vh;
        }
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2a2a3e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid #404060;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #404060;
        }
        .header h1 {
            color: #ffffff;
            margin: 0;
        }
        .header .nav-links {
            display: flex;
            align-items: center;
            gap: 15px;
            margin: 0;
        }
        .header .nav-links a {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .header .nav-links a:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        .header button {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .header button:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
        .users-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
            background: #333344;
            border-radius: 10px;
            overflow: hidden;
        }
        .users-table thead {
            background: #404060;
        }
        .users-table th,
        .users-table td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #404060;
        }
        .users-table th {
            font-weight: bold;
            color: #ffffff;
            text-transform: uppercase;
            font-size: 12px;
            letter-spacing: 1px;
        }
        .users-table td {
            color: #b0b0c0;
        }
        .users-table tr:hover {
            background-color: #404060;
        }
        .role-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-weight: bold;
            text-transform: uppercase;
        }
        .role-admin {
            background-color: #dc3545;
            color: #ffffff;
        }
        .role-user {
            background-color: #6c757d;
            color: #ffffff;
        }
        .reset-btn {
            background: linear-gradient(135deg, #ffc107, #e0a800);
            color: #212529;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .reset-btn:hover {
            background: linear-gradient(135deg, #e0a800, #d39e00);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(255, 193, 7, 0.4);
        }
        .delete-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .delete-btn:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
        .delete-btn:disabled {
            background: #6c757d;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 25px;
            border-radius: 6px;
            color: white;
            font-weight: bold;
            z-index: 1000;
            animation: slideIn 0.3s ease-out;
            min-width: 200px;
            text-align: center;
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
        }
        .notification.error {
            background-color: rgba(220, 53, 69, 0.9);
            border: 1px solid #dc3545;
        }
        .notification.success {
            background-color: rgba(40, 167, 69, 0.9);
            border: 1px solid #28a745;
        }
        @keyframes slideIn {
            from {
                transform: translate(-50%, -100%);
                opacity: 0;
            }
            to {
                transform: translate(-50%, 0);
                opacity: 1;
            }
        }
        .no-users {
            text-align: center;
            padding: 40px;
            color: #b0b0c0;
            background: #333344;
            border-radius: 10px;
            border: 1px solid #404060;
        }
        .admin-stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        .stat-card {
            background: #333344;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #404060;
            text-align: center;
        }
        .stat-number {
            font-size: 2em;
            font-weight: bold;
            color: #007bff;
            margin-bottom: 5px;
        }
        .stat-label {
            color: #b0b0c0;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="admin-container" ng-controller="AdminController">
        <div class="notification" ng-class="{'error': !success, 'success': success}" ng-show="message">
            {{message}}
        </div>

        <div class="header">
            <h1>Admin Panel</h1>
            <div class="nav-links">
                <a href="/shop.html">Shop</a>
                <a href="/profile.html">Profile</a>
                <button ng-click="logout()">Logout</button>
            </div>
        </div>

        <div class="admin-stats">
            <div class="stat-card">
                <div class="stat-number">{{users.length}}</div>
                <div class="stat-label">Total Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">{{getAdminCount()}}</div>
                <div class="stat-label">Admin Users</div>
            </div>
            <div class="stat-card">
                <div class="stat-number">{{getUserCount()}}</div>
                <div class="stat-label">Regular Users</div>
            </div>
        </div>

        <div ng-if="users.length === 0" class="no-users">
            <h3>No users found</h3>
            <p>There are currently no users in the system.</p>
        </div>

        <table class="users-table" ng-if="users.length > 0">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Username</th>
                    <th>Email</th>
                    <th>Role</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr ng-repeat="user in users">
                    <td>{{user.id}}</td>
                    <td>{{user.username}}</td>
                    <td>{{user.email}}</td>
                    <td>
                        <span class="role-badge" ng-class="{'role-admin': user.role === 'admin', 'role-user': user.role === 'user'}">
                            {{user.role}}
                        </span>
                    </td>
                    <td>
                        <button class="reset-btn" 
                                ng-click="resetPassword(user.id, user.username)" 
                                style="margin-right: 10px;"
                                title="Reset user password">
                            Reset Password
                        </button>
                        <button class="delete-btn" 
                                ng-click="deleteUser(user.id, user.username)" 
                                ng-disabled="user.id === currentUserId"
                                title="{{user.id === currentUserId ? 'Cannot delete yourself' : 'Delete user'}}">
                            Delete
                        </button>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>
</html>

<!DOCTYPE html>
<html ng-app="vulnerableApp">
<head>
    <title>Vulnerable Shop</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background: linear-gradient(135deg, #1a1a2e, #16213e, #0f3460);
            color: #ffffff;
            min-height: 100vh;
        }
        .shop-container {
            max-width: 1200px;
            margin: 0 auto;
            background: #2a2a3e;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            border: 1px solid #404060;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 2px solid #404060;
        }
        h1 {
            color: #ffffff;
            margin: 0;
        }
        .user-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .profile-image {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid #007bff;
        }
        .default-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: #007bff;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            font-weight: bold;
            border: 2px solid #007bff;
        }
        .username {
            color: #007bff;
            font-weight: bold;
        }
        .profile-link {
            color: #007bff;
            text-decoration: none;
            font-weight: bold;
            transition: color 0.3s ease;
        }
        .profile-link:hover {
            color: #0056b3;
            text-decoration: underline;
        }
        .logout-btn {
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border: none;
            border-radius: 6px;
            padding: 8px 15px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            margin-left: 20px;
        }
        .logout-btn:hover {
            background: linear-gradient(135deg, #c82333, #a71e2a);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(220, 53, 69, 0.4);
        }
        .products {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
            gap: 20px;
            padding: 20px;
        }
        .product {
            border: 1px solid #404060;
            padding: 15px;
            border-radius: 10px;
            background: #333344;
            transition: all 0.3s ease;
            color: #ffffff;
        }
        .product:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 123, 255, 0.2);
            border-color: #007bff;
        }
        .product img {
            width: 100%;
            height: 200px;
            object-fit: cover;
            border-radius: 6px;
        }
        .product h3 {
            color: #ffffff;
            margin: 10px 0;
        }
        .product p {
            color: #b0b0c0;
            margin: 8px 0;
        }
        .price {
            color: #28a745;
            font-weight: bold;
            font-size: 1.1em;
        }
        .product button {
            width: 100%;
            padding: 10px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .product button:hover {
            background: linear-gradient(135deg, #0056b3, #004085);
            transform: translateY(-1px);
            box-shadow: 0 4px 15px rgba(0, 123, 255, 0.4);
        }
        .cart-icon {
            position: relative;
            cursor: pointer;
            padding: 10px;
            transition: transform 0.2s ease;
            z-index: 10000;
        }
        .cart-icon:hover {
            transform: scale(1.1);
        }
        .cart-icon i {
            font-size: 24px;
            color: #007bff;
        }
        .cart-count {
            position: absolute;
            top: -5px;
            right: -5px;
            background: linear-gradient(135deg, #dc3545, #c82333);
            color: white;
            border-radius: 50%;
            padding: 2px 6px;
            font-size: 12px;
            font-weight: bold;
        }
        .cart-dropdown {
            position: absolute;
            top: 100%;
            right: 0;
            width: 300px;
            background: #333344;
            border-radius: 10px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            padding: 15px;
            z-index: 10001;
            display: none;
            border: 1px solid #404060;
        }
        .cart-dropdown.show {
            display: block;
        }
        .cart-item {
            display: flex;
            align-items: center;
            padding: 10px 0;
            border-bottom: 1px solid #404060;
            color: #ffffff;
        }
        .cart-item img {
            width: 50px;
            height: 50px;
            object-fit: cover;
            border-radius: 4px;
            margin-right: 10px;
        }
        .cart-item-details {
            flex-grow: 1;
        }
        .cart-item-name {
            font-weight: bold;
            margin: 0;
            color: #ffffff;
        }
        .cart-item-price {
            color: #28a745;
            margin: 0;
        }
        .cart-total {
            margin-top: 10px;
            padding-top: 10px;
            border-top: 2px solid #404060;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            color: #ffffff;
        }
        .cart-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }
        .cart-actions button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        .view-cart-btn {
            background: linear-gradient(135deg, #6c757d, #5a6268);
            color: white;
        }
        .view-cart-btn:hover {
            background: linear-gradient(135deg, #5a6268, #495057);
            transform: translateY(-1px);
        }
        .checkout-btn {
            background: linear-gradient(135deg, #28a745, #218838);
            color: white;
        }
        .checkout-btn:hover {
            background: linear-gradient(135deg, #218838, #1e7e34);
            transform: translateY(-1px);
        }
        .empty-cart-message {
            text-align: center;
            padding: 20px;
            color: #b0b0c0;
        }
        .remove-btn {
            background: none;
            color: #dc3545;
            border: none;
            cursor: pointer;
            padding: 5px;
            border-radius: 50%;
            width: 25px;
            height: 25px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
        }
        .remove-btn:hover {
            background-color: #dc3545;
            color: white;
            transform: scale(1.1);
        }
    </style>
</head>
<body>
    <div class="shop-container" ng-controller="ShopController">
        <div class="header">
            <h1>Welcome, <span ng-bind-html="trustedUsername"></span>!</h1>
            <div class="user-info">
                <img ng-if="user.profile_image" class="profile-image" ng-src="{{user.profile_image}}" alt="Profile Image">
                <div ng-if="!user.profile_image" class="default-avatar">
                    {{user.username.charAt(0).toUpperCase()}}
                </div>
                <a href="/profile.html" class="profile-link" ng-bind-html="trustedUsername"></a>
                <div class="cart-icon" ng-click="toggleCart()">
                    <i class="fas fa-shopping-cart"></i>
                    <span class="cart-count" ng-if="cart.length > 0">{{cart.length}}</span>
                    <div class="cart-dropdown" ng-class="{'show': showCart}">
                        <div ng-if="cart.length === 0" class="empty-cart-message">
                            Your cart is empty
                        </div>
                        <div ng-if="cart.length > 0">
                            <div class="cart-item" ng-repeat="item in cart">
                                <img ng-src="{{item.image}}" alt="{{item.name}}">
                                <div class="cart-item-details">
                                    <p class="cart-item-name">{{item.name}}</p>
                                    <p class="cart-item-price">${{item.price}} x {{item.quantity}}</p>
                                </div>
                                <button class="remove-btn" ng-click="removeFromCart($index)">×</button>
                            </div>
                            <div class="cart-total">
                                <span>Total:</span>
                                <span>${{getTotal().toFixed(2)}}</span>
                            </div>
                            <div class="cart-actions">
                                <button class="view-cart-btn" ng-click="goToCheckout()">View Cart</button>
                                <button class="checkout-btn" ng-click="checkout()">Checkout</button>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="logout-btn" ng-click="logout()">Logout</button>
            </div>
        </div>
        
        <div class="products">
            <div class="product" ng-repeat="product in products">
                <img ng-src="{{product.image}}" alt="{{product.name}}">
                <h3>{{product.name}}</h3>
                <p>{{product.description}}</p>
                <p class="price">Price: ${{product.price}}</p>
                <button ng-click="addToCart(product)">Add to Cart</button>
            </div>
        </div>
    </div>
</body>
</html>

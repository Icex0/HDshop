<!DOCTYPE html>
<html ng-app="vulnerableApp">
<head>
    <title>Vulnerable Login</title>
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>
    <script src="app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f0f0f0;
        }
        .login-container {
            background: white;
            padding: 20px;
            border-radius: 5px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
            width: 300px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        input {
            width: 100%;
            padding: 8px;
            margin-top: 5px;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 10px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 10px;
        }
        button:hover {
            background-color: #0056b3;
        }
        .register-link {
            text-align: center;
            margin-top: 15px;
        }
        .register-link a {
            color: #007bff;
            text-decoration: none;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="login-container" ng-controller="LoginController">
        <h2>Login</h2>
        <form ng-submit="login()">
            <div class="form-group">
                <label for="username">Username:</label>
                <input type="text" id="username" ng-model="credentials.username" required>
            </div>
            <div class="form-group">
                <label for="password">Password:</label>
                <input type="password" id="password" ng-model="credentials.password" required>
            </div>
            <button type="submit">Login</button>
        </form>
        <p ng-if="message" style="color: {{success ? 'green' : 'red'}}">{{message}}</p>
        <div class="register-link">
            Don't have an account? <a href="/register.html">Create one here</a>
        </div>
    </div>
</body>
</html>
